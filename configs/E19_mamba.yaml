# E19: Phase E Global Context — 2D Cross-Scan Mamba / Selective SSM (2x SS2D, 16x16 tokens, O(N D d_state))
exp_id: "E19_Mamba"
description: "Winning PDN-S PUAD + 2-layer 2D Bidirectional Cross-Scan Selective SSM (Mamba) on 16x16 spatial tokens"

model:
  type: "enhanced_puad"
  pdn_size: "s"
  padding: false
  out_channels: 384
  dropout_p: 0.2
  context: "mamba"
  context_grid_size: 16
  context_depth: 2

training:
  batch_size: 8
  epochs: 200
  optimizer: "adamw"
  scheduler: "cosine"
  lr: 3.0e-4
  lr_after_decay: 1.0e-5
  weight_decay: 1.0e-4
  early_stopping:
    patience: 10
    min_delta: 0.0
