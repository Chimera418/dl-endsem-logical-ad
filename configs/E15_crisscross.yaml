# E15: Phase C Attention Investigation — Criss-Cross Attention (R=2)
exp_id: "E15_CrissCross"
description: "Winning PDN-S PUAD + Recurrent Criss-Cross Attention (R=2) after conv3 (256x59x59)"

model:
  type: "enhanced_puad"
  pdn_size: "s"
  padding: false
  out_channels: 384
  dropout_p: 0.2
  attention: "crisscross"

training:
  batch_size: 8
  epochs: 200
  optimizer: "adamw"
  scheduler: "cosine"
  lr: 3.0e-4
  lr_after_decay: 1.0e-5
  weight_decay: 1.0e-4
  early_stopping:
    patience: 10
    min_delta: 0.0
