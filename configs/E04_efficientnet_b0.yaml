# E04: Phase B Backbone Investigation — EfficientNet-B0
exp_id: "E04_EfficientNetB0"
description: "PUAD with EfficientNet-B0 frozen ImageNet teacher + trainable EfficientNet-B0 student + AutoEncoder + Ledoit-Wolf Mahalanobis"

model:
  type: "backbone_puad"
  backbone: "efficientnet_b0"
  tap_strides: [8, 16, 32]
  target_grid: 32
  out_channels: 384
  dropout_p: 0.2

training:
  batch_size: 8
  epochs: 80
  optimizer: "adamw"
  scheduler: "cosine"
  lr: 3.0e-4
  lr_after_decay: 1.0e-5
  weight_decay: 1.0e-4
  early_stopping:
    patience: 15
    min_delta: 0.0
