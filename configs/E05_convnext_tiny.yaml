# E05: Phase B Backbone Investigation — ConvNeXt-Tiny
exp_id: "E05_ConvNeXtTiny"
description: "PUAD with ConvNeXt-Tiny frozen ImageNet teacher + trainable ConvNeXt-Tiny student + AutoEncoder + Ledoit-Wolf Mahalanobis"

model:
  type: "backbone_puad"
  backbone: "convnext_tiny"
  tap_strides: [8, 16, 32]
  target_grid: 32
  out_channels: 384
  dropout_p: 0.2

training:
  batch_size: 8
  epochs: 80
  optimizer: "adamw"
  scheduler: "cosine"
  lr: 3.0e-4
  lr_after_decay: 1.0e-5
  weight_decay: 1.0e-4
  early_stopping:
    patience: 15
    min_delta: 0.0
