# E01: Original PUAD Reference Architecture (Combined 5-Category Training)
#
# Modes supported:
#   1. --mode verify_a2 : Evaluates the exact untouched Assignment 2 Combined PUAD
#      checkpoint (batch_size=1, 70k iters, FP32 -> 87.56% Mean / 83.30% Pooled).
#   2. --mode train     : Trains Original PUAD from scratch under the exact unified
#      200-epoch protocol (batch_size=8, AdamW lr=3e-4->1e-5 cosine, patience=20)
#      identical to E02..E05 for a strictly controlled apples-to-apples comparison.

exp_id: "E01_PUAD_200ep"
description: "Original PUAD reference (frozen PDN-S teacher + PDN-S student + AutoEncoder + Ledoit-Wolf Mahalanobis) under unified 200-epoch protocol"

model:
  type: "original_puad"
  pdn_size: "s"
  padding: false
  out_channels: 384
  dropout_p: 0.2

training:
  batch_size: 8
  epochs: 200
  optimizer: "adamw"
  scheduler: "cosine"
  lr: 3.0e-4
  lr_after_decay: 1.0e-5
  weight_decay: 1.0e-4
  early_stopping:
    patience: 20
    min_delta: 0.0

puad:
  pooling: "global_average"
  covariance: "ledoit_wolf"
  inverse: "pinv"
  combination: "sum_of_z_scores"
