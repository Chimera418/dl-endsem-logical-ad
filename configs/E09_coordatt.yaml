# E09: Phase C Attention Investigation — Coordinate Attention (CoordAtt)
exp_id: "E09_CoordAtt"
description: "Winning PDN-S PUAD + Coordinate Attention (orthogonal H/W pooling) after conv3 (256x59x59)"

model:
  type: "enhanced_puad"
  pdn_size: "s"
  padding: false
  out_channels: 384
  dropout_p: 0.2
  attention: "coordatt"

training:
  batch_size: 8
  epochs: 200
  optimizer: "adamw"
  scheduler: "cosine"
  lr: 3.0e-4
  lr_after_decay: 1.0e-5
  weight_decay: 1.0e-4
  early_stopping:
    patience: 10
    min_delta: 0.0
