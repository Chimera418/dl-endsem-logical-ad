# E11: Phase C Attention Investigation — SimAM (Parameter-Free 3D Energy)
exp_id: "E11_SimAM"
description: "Winning PDN-S PUAD + SimAM parameter-free 3D energy attention after conv3 (256x59x59)"

model:
  type: "enhanced_puad"
  pdn_size: "s"
  padding: false
  out_channels: 384
  dropout_p: 0.2
  attention: "simam"

training:
  batch_size: 8
  epochs: 200
  optimizer: "adamw"
  scheduler: "cosine"
  lr: 3.0e-4
  lr_after_decay: 1.0e-5
  weight_decay: 1.0e-4
  early_stopping:
    patience: 10
    min_delta: 0.0
